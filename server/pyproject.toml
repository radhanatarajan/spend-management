[project]
name = "server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bcrypt>=5.0.0",
    "celery>=5.6.3",
    "cryptography>=48.0.0",
    "fastapi>=0.136.1",
    "numpy>=2.4.4",
    "pandas>=3.0.3",
    "passlib>=1.7.4",
    "pydantic-settings>=2.14.1",
    "pymysql>=1.1.3",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.28",
    "redis>=7.4.0",
    "scikit-learn>=1.8.0",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.47.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
